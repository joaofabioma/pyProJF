[tool.poetry.scripts]
app = "app.cli:main"

[tool.poetry]
name = "App"
version = "0.1.0"
authors = ["Nome Autor <email@do_autor.com.br>"]
readme = "README.md"
packages = [{ include = "app", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
requests = "^2.34.2"
pydantic = "^2.13.5"
sqlalchemy = "^2.1.3"
pydantic-settings = "^2.15.0"

[tool.poetry.group.dev.dependencies]
typer = "^0.27.3"
pydantic = "^2.13.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"