[project]
name = "App"
version = "0.1.0"
authors = [{ name = "Nome Autor", email = "email@do_autor.com.br" }]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "Flask>=3.1.3",
    "pydantic>=2.13.5,<3.0.0",
    "pydantic-settings>=2.15.0,<3.0.0",
    "requests>=2.34.2,<3.0.0",
    "sqlalchemy>=2.1.3,<3.0.0",
    "typer>=0.27.3",
    "waitress>=3.0.0",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
